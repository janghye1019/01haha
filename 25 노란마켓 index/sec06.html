<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sec06</title>


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <link rel="stylesheet" href="./asset/css/swiper-bundle.min.css">

    <link rel="stylesheet" href="./asset/css/sec06.css">
</head>

<body>

    <!-- -------------------sec06---------ask------------- -->
    <section class="sec06" id="sec06">
        <div class="sec06-ask">

            <div class="sec06-img"></div>

            <div class="sec06-box">

                <div class="sec06-title">
                    <h4>복잡하시다구요?!</h4>
                    <h2>맞춤 상품 상담 신청하기</h2>
                </div>

                <form class="sec06-form">

                    <fieldset class="sec06-input">
                        <div class="sec06-item">

                            <label for="name">
                                <input type="text" id="name" placeholder="이름을 입력해주세요" required>
                            </label>

                            <label for="tel">
                                <input type="tel" dir="tel" id="tel" placeholder="번호를 입력해주세요" required>
                            </label>

                        </div>


                        <div class="sec06-kind">

                            <label for="model">
                                <input type="text" id="model" placeholder="기종명" required>
                            </label>


                            <select name="press" id="press" class="select">
                                <option value="nomal" selected>

                                    <span style="color: gray;">통신사</span>

                                </option>

                                <option value="SK">SK 통신사</option>
                                <option value="KT">KT 통신사</option>
                                <option value="LG">LG U+</option>
                                <option value="FREE">자급제</option>
                            </select>
                            <i class="fa fa-angle-down sec06-arrow"></i>
                        </div>

                        <button class="sec06-btn" type="submit">상담예약하기</button>

                    </fieldset>
                </form>
                <!-- </div> -->


            </div>

    </section>

    <script src="./asset/js/jquery-3.7.1.min.js"></script>

    <script src="./asset/js/swiper-bundle.min.js"></script>

    <script src="https://use.fontawesome.com/releases/v5.2.0/js/all.js"></script>


    <script src="./asset/js/ScriptYellowmarket.js">


    </script>
</body>

</html>
