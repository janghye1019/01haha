<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sec06</title>

    <link rel="stylesheet" href="./sec06 부분 style.css">
</head>

<body>

    <!-- -------------------sec06---------ask------------- -->
    <section class="sec06" id="sec06">
        <div class="sec06-ask">

            <div class="sec06-img"></div>

            <div class="sec06-box">

                <div class="sec06-title">
                    <h4>복잡하시다구요?!</h4>
                    <h2>맞춤 상품 상담 신청하기</h2>
                </div>

                <form class="sec06-form">

                    <fieldset class="sec06-input">
                        <div class="sec06-item">

                            <label for="name">
                                <input type="text" id="name" placeholder="이름을 입력해주세요" required>
                            </label>

                            <label for="tel">
                                <input type="tel" dir="tel" id="tel" placeholder="번호를 입력해주세요" required>
                            </label>

                        </div>


                        <div class="sec06-kind">

                            <label for="model">
                                <input type="text" id="model" placeholder="기종명" required>
                            </label>


                            <select name="press" id="press" class="select">
                                <option value="nomal" selected><span style="color: gray;">통신사</span></option>

                                <option value="SK">SK 통신사</option>
                                <option value="KT">KT 통신사</option>
                                <option value="LG">LG U+</option>
                                <option value="FREE">자급제</option>
                            </select>
                        </div>

                        <button class="sec06-btn" type="submit">상담예약하기</button>

                    </fieldset>
                </form>
            </div>


        </div>
        </div>
    </section>


</body>

</html>
