    <script>
        let swiper = new Swiper(".mySwiper3", {
            slidesPerView: 1,
            grid: {
                rows: 2,
            },
            spaceBetween: 10,
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
            breakpoints: {
                1024: {
                    slidesPerView: 2,
                    spaceBetween: 30,
                    grid: {
                        rows: 2,
                    },
                },
            },
        });
    </script>
